name: Android debug build (offline database integration)
on:
  pull_request:
    paths:
      - 'android/**'
      - 'tools/**'
      - 'web/**'
      - 'data/**'
      - '.gitmodules'
      - 'shared-nmp'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android command-line tools and SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools/latest" "$RUNNER_TEMP/android-cmdline"
          curl --fail --location --retry 3 --silent --show-error \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            --output "$RUNNER_TEMP/android-cmdline-tools.zip"
          unzip -q "$RUNNER_TEMP/android-cmdline-tools.zip" -d "$RUNNER_TEMP/android-cmdline"
          cp -R "$RUNNER_TEMP/android-cmdline/cmdline-tools/." "$SDK/cmdline-tools/latest/"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null
          set -o pipefail
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Restore verified clinical archive cache
        uses: actions/cache@v4
        with:
          path: .cache/kr_full.db.gz
          key: kr-59fae545-ae62b884144dda073c96c8546b3a688728b2acb765851da491d6e06e63cadf22
      - name: Restore verified routing source cache
        uses: actions/cache@v4
        with:
          path: .cache/nmp_route
          key: nmp-route-80ea4c02-cf3426a3-79dfbe72
      - name: Generate complete offline clinical assets
        shell: bash
        run: |
          set -euo pipefail
          sh tools/fetch_kr.sh
          python3 tools/build_app.py www --db .cache/kr_full.db
          test -s android/app/src/main/assets/www/data_mkb.js
          test -s android/app/src/main/assets/www/data_brief.js
          test -s android/app/src/main/assets/www/route_data.js
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          root = Path('android/app/src/main/assets/www')
          html = (root / 'index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script\s+src="([^"]+)"', html)
          assert scripts, 'No scripts declared in offline HTML'
          for src in scripts:
              assert not src.startswith(('http:', 'https:', '/')), f'Non-local script: {src}'
              assert (root / src).is_file(), f'Missing referenced script: {src}'
          for name, var in [('data_meta.js', 'META'), ('data_brief.js', 'BRIEF'),
                            ('data_mkb.js', 'MKB')]:
              body = (root / name).read_text(encoding='utf-8')
              match = re.search(r'\b(?:var|const|let)\s+' + var + r'\s*=\s*', body)
              assert match, f'{name}: missing {var} declaration'
              obj, end = json.JSONDecoder().raw_decode(body[match.end():].lstrip())
              assert body[match.end():].lstrip()[end:].lstrip().startswith(';'), f'{name}: missing terminator'
              assert isinstance(obj, (dict, list)) and obj, f'{name}: empty dataset'
              print(name, 'parsed:', len(obj), 'top-level entries')
          print('Offline HTML references and core JSON datasets validated')
          PY
          for script in android/app/src/main/assets/www/*.js; do node --check "$script" >/dev/null; done
      - name: Compile Android debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Compile release APK with CI debug signing (not for distribution)
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify required offline files inside APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          for file in index.html app.js drugs.js data_meta.js data_brief.js data_ref.js data_terms.js data_mkb.js data_intl.js data_rx.js route_data.js route_addr.js ota_version.txt; do
            unzip -Z1 "$APK" | grep -Fx "assets/www/$file" > /dev/null || { echo "::error::Missing APK asset: $file"; exit 1; }
          done
          RELEASE=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$RELEASE"
          for file in index.html app.js data_meta.js data_brief.js data_mkb.js ota_version.txt; do
            unzip -Z1 "$RELEASE" | grep -Fx "assets/www/$file" > /dev/null || { echo "::error::Missing release asset: $file"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk-unverified
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: victorpolekslab/Spravochnik_nmp
          ref: 576ec758212e4885b9973147d7b609b08becba3a
          path: backend-audit
          persist-credentials: false
      - name: Android emulator runtime and WebView
        env:
          MEDICAL_ANDROID_START_EMULATOR: '1'
          MP_ANDROID_APP: terapevt
          MP_E2E_HARNESS: backend-audit/integration/medical-platform/077_android_backend.sh
          MP_THERAPIST_WEB: ${{ github.workspace }}/web
        shell: bash
        run: |
          APK=$(find android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          bash integration/medical-platform/076_android.sh "$APK" android-runtime-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-runtime-evidence
          path: android-runtime-evidence/

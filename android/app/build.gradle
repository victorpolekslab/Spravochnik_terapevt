plugins { id 'com.android.application' }

android {
    namespace 'ru.klinrek.terapevt'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.klinrek.terapevt'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1 (КР от 03.11.2026)"
    }

    signingConfigs {
        release {
            // keystore.properties (не в git): storeFile, storePassword, keyAlias, keyPassword
            def kp = rootProject.file('keystore.properties')
            if (kp.exists()) {
                def p = new Properties(); kp.withInputStream { p.load(it) }
                storeFile file(p['storeFile']); storePassword p['storePassword']
                keyAlias p['keyAlias']; keyPassword p['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig rootProject.file('keystore.properties').exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies { implementation project(':drugs-core') }


 // Generated by tools/build_app.py www from the verified clinical recommendations database.
 // Do not silently package the source web/ folder: it lacks generated data_*.js files.
 tasks.register('verifyOfflineAssets') {
     doLast {
         def root = file('src/main/assets/www')
         def required = ['index.html', 'app.js', 'drugs.js', 'data_meta.js',
                         'data_brief.js', 'data_ref.js', 'data_terms.js',
                         'data_mkb.js', 'data_intl.js', 'data_rx.js',
                         'route_data.js', 'route_addr.js', 'ota_version.txt']
         def missing = required.findAll { !new File(root, it).isFile() }
         if (!missing.isEmpty()) throw new GradleException(
             'Missing generated offline assets: ' + missing.join(', ') +
             '. Run tools/build_app.py www with a verified KR database first.')
     }
 }
 tasks.named('preBuild').configure { dependsOn(tasks.named('verifyOfflineAssets')) }

plugins { id 'com.android.application' }

android {
    namespace 'ru.klinrek.terapevt'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.klinrek.terapevt'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1 (КР от 03.11.2026)"
    }

    signingConfigs {
        release {
            // keystore.properties (не в git): storeFile, storePassword, keyAlias, keyPassword
            def kp = rootProject.file('keystore.properties')
            if (kp.exists()) {
                def p = new Properties(); kp.withInputStream { p.load(it) }
                storeFile file(p['storeFile']); storePassword p['storePassword']
                keyAlias p['keyAlias']; keyPassword p['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig rootProject.file('keystore.properties').exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies { implementation project(':drugs-core') }

 // The APK must contain a complete offline UI; the web/ directory is the source of truth.
 // A successful Gradle build without www/index.html would produce an unusable APK.
 def offlineAssetsDir = layout.buildDirectory.dir('generated/offline-assets')
 tasks.register('bundleOfflineWeb', Copy) {
     from(rootProject.file('../web')) {
         include 'index.html', '*.js', '*.css', '*.png', '*.webmanifest'
     }
     into(offlineAssetsDir.map { it.dir('www') })
     doLast {
         def versionFile = offlineAssetsDir.get().file('www/ota_version.txt').asFile
         versionFile.parentFile.mkdirs()
         versionFile.text = '0'
         if (!offlineAssetsDir.get().file('www/index.html').asFile.isFile()) {
             throw new GradleException('Offline index.html missing from Android APK assets')
         }
     }
 }
 android.sourceSets.main.assets.srcDir(offlineAssetsDir)
 tasks.named('preBuild').configure { dependsOn(tasks.named('bundleOfflineWeb')) }
